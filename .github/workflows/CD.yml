name: CD Pipeline Debug

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug - Check secrets exist
        run: |
          echo "Checking if secrets are set..."
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is empty!"
          else
            echo "DOCKERHUB_USERNAME is set (length: ${#DOCKERHUB_USERNAME})"
          fi
          
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is empty!"
          else
            echo "DOCKERHUB_TOKEN is set (length: ${#DOCKERHUB_TOKEN})"
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Debug - Show Docker version
        run: |
          docker --version
          docker info

      - name: Log in to Docker Hub
        run: |
          echo "Attempting Docker login..."
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          echo "Docker login successful!"

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          cd Weather-ML-CICD-Incomplete
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:latest .
          echo "Build complete!"

      - name: Push Docker image
        run: |
          echo "Pushing to Docker Hub..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:latest
          echo "Push successful!"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubernetes
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "Kubeconfig configured"

      - name: Test Kubernetes connection
        run: |
          echo "Testing Kubernetes connection..."
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to Kubernetes..."
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: weather-ml-app
          spec:
            replicas: 2
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 0
            selector:
              matchLabels:
                app: weather-ml-app
            template:
              metadata:
                labels:
                  app: weather-ml-app
              spec:
                containers:
                - name: weather-ml-app
                  image: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:latest
                  ports:
                  - containerPort: 8000
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: weather-ml-app-service
          spec:
            type: LoadBalancer
            selector:
              app: weather-ml-app
            ports:
            - port: 80
              targetPort: 8000
          EOF
          echo "Deployment applied"

      - name: Wait for deployment
        run: |
          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/weather-ml-app --timeout=3m
          echo "Deployment complete!"

      - name: Show deployment status
        run: |
          echo "=== Pods ==="
          kubectl get pods -l app=weather-ml-app
          echo "=== Service ==="
          kubectl get service weather-ml-app-service
