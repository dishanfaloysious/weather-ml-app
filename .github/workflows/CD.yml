name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub (direct method)
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
      - name: Verify Docker login
        run: |
          docker info | grep Username || echo "Docker login successful"

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:latest .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:latest \
               ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubernetes
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: weather-ml-app
          spec:
            replicas: 2
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 0
            selector:
              matchLabels:
                app: weather-ml-app
            template:
              metadata:
                labels:
                  app: weather-ml-app
              spec:
                containers:
                - name: weather-ml-app
                  image: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:${{ github.sha }}
                  ports:
                  - containerPort: 8000
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: weather-ml-app-service
          spec:
            type: LoadBalancer
            selector:
              app: weather-ml-app
            ports:
            - port: 80
              targetPort: 8000
          EOF

      - name: Wait for deployment
        run: kubectl rollout status deployment/weather-ml-app --timeout=3m
