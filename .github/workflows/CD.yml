name: CD pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]  # Replace with your CI workflow name
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted  # Uses your EC2 runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set kubeconfig
        run: export KUBECONFIG=$HOME/.kube/config

      - name: Deploy weather app (rolling update)
        run: |
          # Check if deployment exists
          if kubectl get deployment weather-ml-app; then
            # Rolling update: update the image without deleting the deployment
            kubectl set image deployment/weather-ml-app weather-ml-app=${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:v1 --record
          else
            # Create deployment if it doesn’t exist yet
            kubectl create deployment weather-ml-app --image=${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:v1
            kubectl expose deployment weather-ml-app --type=NodePort --port=5000
          fi
          
          # Wait for the rollout to finish
          kubectl rollout status deployment/weather-ml-app

      - name: Verify deployment
        run: kubectl get pods -o wide
