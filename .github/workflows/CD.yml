name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up kubeconfig
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push Docker image
      - name: Build and push Docker image
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Ensure correct path for Docker context
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$COMMIT_SHA ./Weather-ML-CICD-Incomplete
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$COMMIT_SHA

      # 5. Deploy to Kubernetes
      - name: Deploy to Kubernetes
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app
          COMMIT_SHA: ${{ github.sha }}
        run: |
          kubectl set image deployment/weather-ml weather-ml=$IMAGE_NAME:$COMMIT_SHA --record
          kubectl rollout status deployment/weather-ml
