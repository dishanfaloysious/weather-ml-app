name: CD pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]  # Replace with your CI workflow name
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set kubeconfig
        run: export KUBECONFIG=$HOME/.kube/config

      - name: Deploy weather app
        run: |
          # Delete existing deployment and service if they exist
          kubectl delete deployment weather-ml-app --ignore-not-found
          kubectl delete service weather-ml-app --ignore-not-found
          
          # Create new deployment with your Docker image
          kubectl create deployment weather-ml-app --image=${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:v1
          
          # Expose it via NodePort on port 5000
          kubectl expose deployment weather-ml-app --type=NodePort --port=5000
          
          # Wait for pods to be ready
          kubectl rollout status deployment/weather-ml-app
