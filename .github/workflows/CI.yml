name: CI Pipeline

on:
  push:
    branches: [ "main", "bugfix" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r Weather-ML-CICD-Incomplete/requirements.txt

      - name: Run unit test
        working-directory: Weather-ML-CICD-Incomplete
        run: python unit_test.py

      - name: Run smoke test
        working-directory: Weather-ML-CICD-Incomplete
        run: python smoke_test.py

      - name: Run integration test
        working-directory: Weather-ML-CICD-Incomplete
        run: python integration_test.py

      - name: Build Docker Image
        run: docker build -t weather-ml-app:latest .

      - name: Test container startup
        run: docker run --rm weather-ml-app:latest python --version

  deploy:
    needs: build-and-test
    uses: ./.github/workflows/deploy.yml
    with:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      kube_config: ${{ secrets.KUBE_CONFIG }}
